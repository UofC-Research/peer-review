[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-elt"
version = "0.1.0"
description = "ELT pipeline for quantifying preprint changes in peer review"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Albert Leung", email = 'albert.leung@ucalgary.ca' }
]
dependencies = [
    "duckdb>=1.4.3",
  "pandas>=3.0.3",
  "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
  "requests>=2.32.3",
    "tenacity>=9.1.4",
    "sqlalchemy>=2.0.48",
  "psycopg2-binary>=2.9.9",
  "PyPDF2>=3.0.1",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/UofC-Research/peer-review"
Issues = "https://github.com/UofC-Research/peer-review/issues"
Homepage = "https://github.com/UofC-Research/peer-review"

[project.scripts]
peer-elt = "peer_elt.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
  "black",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["peer_elt"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
