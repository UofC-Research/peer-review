[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-elt"
version = "0.1.0"
description = "ELT pipeline for quantifying preprint changes in peer review"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Albert Leung" }
]
dependencies = [
  "duckdb==0.10.3",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "pyyaml==6.0.2",
  "requests==2.32.3",
  "tenacity==8.3.0",
  "sqlalchemy==2.0.32",
  "psycopg2-binary==2.9.9",
  "PyPDF2==3.0.1",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/UofC-Research/peer-review"
Issues = "https://github.com/UofC-Research/peer-review/issues"
Homepage = "https://github.com/UofC-Research/peer-review"

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-cov",
  "black",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
