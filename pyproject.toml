[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-elt"
version = "0.1.0"
description = "ELT pipeline for quantifying preprint changes in peer review"
requires-python = ">=3.11"
dependencies = [
  "duckdb==0.10.3",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "pyyaml==6.0.2",
  "requests==2.32.3",
    "tenacity==8.3.0",
  "sqlalchemy==2.0.32",
  "psycopg2-binary==2.9.9",
  "PyPDF2==3.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
