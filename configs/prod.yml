# Production config.
# Loads repo-root .env before expanding POSTGRES_URL.
environment:
  load_env_file: true
  env_file: ../.env

# Full study source window for production extraction.
sources:
  - name: biorxiv
    server: biorxiv
    date_from: "2020-01-01"
    date_to: "2025-12-31"
  - name: medrxiv
    server: medrxiv
    date_from: "2020-01-01"
    date_to: "2025-12-31"

# Production writes to PostgreSQL using POSTGRES_URL from the environment/.env.
storage:
  backend: postgres
  postgres_url: ${POSTGRES_URL}

# Production keeps file output compact by writing Parquet only.
output:
  base_dir: data/processed
  write_csv: false

# Enable PDF-diff features for the production study run.
transform:
  enable_pdf_diff: true
  pdf_dir: data/raw/pdfs

# Longer retry policy for production network/API calls.
retry:
  max_attempts: 8
  wait_min_seconds: 2
  wait_max_seconds: 120
  wait_multiplier: 2

# Optional production TDM requester-pays S3 settings.
# These keys are ignored by the core pipeline loader but are consumed by
# peer_elt.acquire.tdm helpers and by opt-in live AWS tests when copied into a
# live-test config with enabled/live_aws_tests_enabled set to true.
tdm_repository:
  enabled: false
  live_aws_tests_enabled: false
  aws_executable: aws
  env_file: .env
  purpose: bulk_preprint_full_text
  access_method: requester_pays_s3
  local_cache_dir: data/raw/tdm
  expected_package_format: meca_zip
  preferred_content_formats:
    - xml
    - pdf
    - html
  servers:
    - server: biorxiv
      documentation_url: "https://www.biorxiv.org/tdm"
      bucket: "s3://biorxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true
    - server: medrxiv
      documentation_url: "https://www.medrxiv.org/tdm"
      bucket: "s3://medrxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true
  published_full_text:
    source: publisher_or_doi_resolver
    preferred_content_formats:
      - xml
      - pdf
      - html
