# Example configuration for opt-in live integration tests.
#
# Recommended workflow for live-data pytest runs:
#   1. Copy this file to configs/live_tests.local.yml.
#   2. In configs/live_tests.local.yml, set enabled: true.
#   3. Replace placeholder preprint date windows, published DOIs, and matched
#      pair DOI/version cases with stable live examples you want to monitor.
#   4. Optionally tune timeout_seconds and retry for the external services.
#   5. Run only the live tests:
#        pytest -m live --live-config configs/live_tests.local.yml
#
#      Or run the full Python suite with live tests included:
#        pytest --live-config configs/live_tests.local.yml
#
# You can also point tests at a config with:
#   PEER_REVIEW_LIVE_CONFIG=configs/live_tests.local.yml pytest -m live
#
# For dummy-data/offline runs, do not modify this file. Use:
#   pytest
# or:
#   pytest -m "not live"
#
# Optional bulk acquisition planning:
#   bioRxiv and medRxiv also provide Text and Data Mining (TDM) repositories
#   for bulk preprint full-text access through requester-pays Amazon S3.
#   This example includes a disabled `tdm_repository` block below so local
#   configs can record a TDM-based preprint acquisition option alongside the
#   live API and URL-based tests. The current pytest live tests do not sync S3
#   buckets directly. Local acquisition jobs can call
#   `peer_elt.acquire.tdm.acquire_tdm_preprints_and_published_articles(...)`
#   to automate:
#     1. requester-pays TDM archive sync for configured preprint servers,
#     2. bioRxiv API published-link metadata download for configured windows,
#     3. published article full-text retrieval in XML -> PDF -> HTML order.
#   To use TDM in a local acquisition job, configure AWS credentials, accept
#   requester-pays S3 charges, and provide a client/wrapper that implements
#   `download_prefix(bucket, destination, region=..., requester_pays=...)`.
#   The built-in AWS CLI client reads a repo-root `.env` file when present and
#   recognizes either uppercase AWS CLI variables (`AWS_ACCESS_KEY_ID`,
#   `AWS_SECRET_ACCESS_KEY`, optional `AWS_SESSION_TOKEN`) or lowercase
#   `aws_access_key_id` / `aws_secret_access_key` aliases.
#
# Live tests are opt-in because they use external network resources and may
# fail when upstream services change, rate-limit, or go offline.
#
# The example file is intentionally disabled so normal test runs stay
# deterministic, offline, and safe for CI.
enabled: false

# Per-request timeout, in seconds, for live full-text retrieval tests.
# If omitted, tests default to 20 seconds.
timeout_seconds: 20

# Retry settings passed to peer_elt.config.RetryConfig for live HTTP calls.
# Keep these conservative: live tests are health checks, not long-running
# acquisition jobs.
retry:
  # Total attempts per request, including the first attempt.
  max_attempts: 2

  # Minimum and maximum exponential backoff delay between retry attempts.
  wait_min_seconds: 1
  wait_max_seconds: 5

  # Exponential backoff multiplier used by tenacity.wait_exponential.
  wait_multiplier: 1

# Live preprint API checks.
#
# Each entry calls the configured preprint server API for a small date window
# and asserts that enough rows and expected columns are returned.
preprint_sources:
  # Human-readable case name used in assertion messages.
  - name: biorxiv_small_window

    # Supported values are currently biorxiv and medrxiv.
    server: biorxiv

    # Inclusive date window passed to the bioRxiv/medRxiv API.
    # Use a stable historical window that is unlikely to disappear.
    date_from: "2023-01-01"
    date_to: "2023-01-02"

    # Minimum acceptable number of returned metadata rows.
    min_records: 1

    # Columns that must be present in the returned DataFrame.
    required_columns:
      - doi
      - title
      - version
      - server
      - published_doi

# Live published full-text checks.
#
# Each entry builds published-article full-text candidates from the DOI and
# asserts that at least one acceptable format can be downloaded.
published_full_text:
  - name: elife_sample

    # Published article DOI to resolve. Replace placeholder examples with known
    # stable, accessible articles before enabling live tests.
    published_doi: "10.7554/eLife.12345"

    # Acceptable retrieved artifact formats for this DOI.
    expected_formats:
      - pdf
      - xml
      - html

# Live matched-pair acquisition checks.
#
# Each entry exercises the same acquisition pathway used by matched
# preprint/published pairs. Use carefully selected stable examples here because
# this test may attempt both preprint and publisher downloads.
matched_pairs:
  - name: elife_matched_pair

    # Source preprint server and selected preprint DOI/version.
    server: biorxiv
    preprint_doi: "10.1101/2020.01.01.000001"
    preprint_version: "1"

    # Paired published article DOI.
    published_doi: "10.7554/eLife.12345"

    # When true, both the preprint and published article must download
    # successfully. When false, at least one side must download successfully.
    # Set false for monitoring upstream availability during early setup; set
    # true for strict release/data-acquisition validation.
    require_both_success: false

# Optional TDM repository acquisition plan.
#
# This block is not consumed by the current pytest live tests. It is consumed by
# `peer_elt.acquire.tdm.tdm_config_from_mapping(...)` and can drive a local
# `acquire_tdm_preprints_and_published_articles(...)` run to sync preprint
# archives, download published-link metadata, and retrieve published article
# full text automatically.
#
# Before setting enabled: true in configs/live_tests.local.yml:
# - Confirm an AWS account and credentials are configured for the process that
#   will run the download.
# - If credentials live in repo-root `.env`, use `AWS_ACCESS_KEY_ID` and
#   `AWS_SECRET_ACCESS_KEY`, or lowercase `aws_access_key_id` and
#   `aws_secret_access_key`; optional session-token and region keys are also
#   propagated to the AWS CLI subprocess.
# - Confirm the AWS principal is allowed to read requester-pays S3 buckets.
# - Confirm requester-pays transfer and request charges are acceptable.
# - Provide an implementation of the `peer_elt.acquire.tdm.TdmArchiveClient`
#   protocol. For AWS CLI, the equivalent command shape is:
#     aws s3 sync s3://biorxiv-src-monthly data/raw/tdm/biorxiv \
#       --region us-east-1 --request-payer requester
#     aws s3 sync s3://medrxiv-src-monthly data/raw/tdm/medrxiv \
#       --region us-east-1 --request-payer requester
#
# Important scope note:
# - The TDM repositories cover bioRxiv/medRxiv preprint full-text packages.
# - Linked published-article metadata still comes from the bioRxiv API
#   `published`/`pubs` fields.
# - Published article full text still comes from publisher, DOI-resolver, PMC,
#   or other article-level sources permitted by the access rules; it is not
#   provided by the bioRxiv/medRxiv preprint TDM buckets.
# - When TDM is selected, process matched preprint and published article files
#   in XML -> PDF -> HTML order. XML is preferred because structured XML-to-XML
#   comparison is more efficient and less brittle than PDF extraction. PDF is
#   the next fallback, and HTML is the final automated fallback to avoid manual
#   web-page saving whenever possible.
tdm_repository:
  # Keep false in this committed example. Set true only in a local config after
  # AWS credentials, requester-pays acceptance, and a TDM archive client are in
  # place.
  enabled: false

  # TDM is used for bulk preprint full text. Published article full-text
  # acquisition is automated separately from publisher/DOI/PMC-style article
  # sources.
  purpose: bulk_preprint_full_text

  # Current helper boundary expects an injected client for this access method.
  # Typical implementations can wrap boto3, AWS CLI, or s3cmd.
  access_method: requester_pays_s3

  # Root local cache directory. Each server sync writes below this directory,
  # for example data/raw/tdm/biorxiv and data/raw/tdm/medrxiv.
  local_cache_dir: data/raw/tdm

  # bioRxiv/medRxiv TDM packages are distributed as MECA zip packages containing
  # full-text content such as XML and PDF. Some downstream paired published
  # articles may only expose HTML through publisher/DOI/PMC routes.
  expected_package_format: meca_zip

  # Desired processing order when TDM is selected:
  # 1. XML: preferred for structured preprint/published comparison.
  # 2. PDF: fallback when XML is unavailable.
  # 3. HTML: final automated fallback; avoid manual web-page saving.
  preferred_content_formats:
    - xml
    - pdf
    - html

  # Server-specific requester-pays S3 resources. Both official buckets are in
  # us-east-1. The requester_pays flag must be propagated by the client.
  servers:
    - server: biorxiv
      documentation_url: "https://www.biorxiv.org/tdm"
      bucket: "s3://biorxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true
    - server: medrxiv
      documentation_url: "https://www.medrxiv.org/tdm"
      bucket: "s3://medrxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true

  # Published-link metadata still comes from the bioRxiv API. The helper
  # function build_published_metadata_url(...) materializes this template for
  # biorxiv or medrxiv, a date interval, and a cursor. The automated TDM
  # workflow downloads these JSON payloads before published full-text retrieval.
  published_metadata:
    source: "https://api.biorxiv.org/pubs/[server]/[interval]/[cursor]"
    note: "Use API-linked published DOI metadata to pair preprints with journal articles."

  # Published article full text is outside the TDM buckets and is retrieved from
  # article-level sources. The automated TDM workflow uses this order for each
  # linked published DOI so matched comparisons use the most structured common
  # representation available.
  published_full_text:
    source: publisher_or_doi_resolver
    preferred_content_formats:
      - xml
      - pdf
      - html
    note: "Use publisher-specific, DOI-resolver, PMC, or other permitted article-level sources for the published manuscript."
