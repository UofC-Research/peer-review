# Local development config.
# Loads repo-root .env before expanding storage variables.
environment:
  load_env_file: true
  env_file: ../.env

# Shorter 2023-only source window for local iteration.
sources:
  - name: biorxiv
    server: biorxiv
    date_from: "2023-01-01"
    date_to: "2023-12-31"
  - name: medrxiv
    server: medrxiv
    date_from: "2023-01-01"
    date_to: "2023-12-31"

# Local runs use a file-backed DuckDB database.
storage:
  backend: duckdb
  duckdb_path: data/processed/peer_review.duckdb

# Write CSV locally for easier manual inspection alongside Parquet.
output:
  base_dir: data/processed
  write_csv: true

# PDF diff is disabled locally to keep iteration faster.
transform:
  enable_pdf_diff: false
  pdf_dir: data/raw/pdfs

# Conservative retry defaults for development API calls.
retry:
  max_attempts: 5
  wait_min_seconds: 1
  wait_max_seconds: 60
  wait_multiplier: 1

# Optional local TDM requester-pays S3 settings.
# These keys are ignored by the core pipeline loader but are consumed by
# peer_elt.acquire.tdm helpers and by opt-in live AWS tests when copied into a
# live-test config with enabled/live_aws_tests_enabled set to true.
tdm_repository:
  enabled: false
  live_aws_tests_enabled: false
  aws_executable: aws
  env_file: .env
  purpose: bulk_preprint_full_text
  access_method: requester_pays_s3
  local_cache_dir: data/raw/tdm
  expected_package_format: meca_zip
  preferred_content_formats:
    - xml
    - pdf
    - html
  servers:
    - server: biorxiv
      documentation_url: "https://www.biorxiv.org/tdm"
      bucket: "s3://biorxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true
    - server: medrxiv
      documentation_url: "https://www.medrxiv.org/tdm"
      bucket: "s3://medrxiv-src-monthly"
      region: "us-east-1"
      requester_pays: true
  published_full_text:
    source: publisher_or_doi_resolver
    preferred_content_formats:
      - xml
      - pdf
      - html
